services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: folio
      POSTGRES_PASSWORD: folio
      POSTGRES_DB: folio_mind
    ports:
      - '5434:5432' # host port — avoid conflict with local PostgreSQL on 5432/5433
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U folio -d folio_mind']
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - '6379:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 5

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minio
      MINIO_ROOT_PASSWORD: miniosecret
      MINIO_CORS_ALLOW_ORIGIN: "*"
    ports:
      - '9000:9000'
      - '9001:9001'
    volumes:
      - minio_data:/data
    healthcheck:
      test: ['CMD-SHELL', 'curl -f http://localhost:9000/minio/health/live || exit 1']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_started
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 minio miniosecret;
      mc mb -p local/folio-mind || true;
      mc anonymous set download local/folio-mind || true;
      mc admin config set local api cors_origins="*" && mc admin service restart local || true;
      for p in folioFiles/originals folioFiles/previews folioFiles/processing folioFiles/exports folioFiles/media folioFiles/rag-sources; do
        echo '' | mc pipe local/folio-mind/$$p/.keep || true;
      done;
      echo 'MinIO ready: bucket folio-mind, objects under folioFiles/*';
      exit 0;
      "

  gotenberg:
    container_name: folio-mind-gotenberg
    image: gotenberg/gotenberg:8
    ports:
      - '3003:3000'
    environment:
      DISABLE_GOOGLE_CHROME: "1"
      DISABLE_UNOCONV: "0"
    volumes:
      - ./tmp/libreoffice:/tmp/libreoffice
    healthcheck:
      test: ['CMD-SHELL', 'curl -f http://localhost:3000/health || exit 1']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  pdf2docx:
    container_name: folio-mind-pdf2docx
    build: ./docker/pdf2docx
    ports:
      - '8080:8080'
    mem_limit: 512m
    healthcheck:
      test: ['CMD', 'python', '-c', "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health')"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s

volumes:
  postgres_data:
  minio_data:
